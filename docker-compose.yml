services:
  streamlit:
    build:
      context: .
    ports:
      - "8501:8501"
    environment:
      - USE_SENTENCE_TRANSFORMERS=false
      - SEMANTIC_PARTIAL_THRESHOLD=0.48

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - USE_SENTENCE_TRANSFORMERS=false
      - SEMANTIC_PARTIAL_THRESHOLD=0.48
