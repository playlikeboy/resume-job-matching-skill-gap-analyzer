services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - USE_SENTENCE_TRANSFORMERS=false
      - SEMANTIC_PARTIAL_THRESHOLD=0.48
      - CORS_ORIGINS=http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
