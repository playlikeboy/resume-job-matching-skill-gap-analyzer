services:
  - type: web
    name: matchwise-streamlit
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: USE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: SEMANTIC_PARTIAL_THRESHOLD
        value: "0.48"

  - type: web
    name: matchwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: USE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: SEMANTIC_PARTIAL_THRESHOLD
        value: "0.48"
