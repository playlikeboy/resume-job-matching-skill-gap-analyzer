services:
  - type: web
    name: matchwise-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: USE_SENTENCE_TRANSFORMERS
        value: "false"
      - key: SEMANTIC_PARTIAL_THRESHOLD
        value: "0.48"
      - key: CORS_ORIGINS
        value: "https://playlikeboy.github.io"

  - type: web
    name: matchwise-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: matchwise-api
          envVarKey: RENDER_EXTERNAL_URL
